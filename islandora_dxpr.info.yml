type: theme
core_version_requirement: '^10.3 || ^11'
base theme: dxpr_theme

name: 'Islandora DXPR Theme'
description: 'An Islandora subtheme of DXPR Theme.'
package: Islandora
logo: logo.svg

dependencies:
  - dxpr_theme:dxpr_theme (>=8.1.0)
  - islandora:islandora (>=2.18.5)

regions:
  secondary_header: 'Secondary Header'
  navigation: 'Navigation'
  navigation_collapsible: 'Navigation (Collapsible)'
  highlighted: 'Hero Region'
  page_title: 'Page Title'
  help: 'Help'
  content_top: 'Content Top'
  content: 'Content'
  content_bottom: 'Content Bottom'
  sidebar_first: 'Primary'
  sidebar_second: 'Secondary'
  footer: 'Footer'
  page_top: 'Page top'
  page_bottom: 'Page bottom'

libraries:
  - islandora_dxpr/global-styling

