name: Mirror and run GitLab CI

on:
  push:
    branches: [1.x]
    tags: '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Mirror + trigger CI
      uses: SvanBoxel/gitlab-mirror-and-ci-action@5c211f993d35256d96b772d995972f434b94e11a # master
      with:
        args: "https://git.drupalcode.org/project/islandora_dxpr"
      env:
        FOLLOW_TAGS: "true"
        FORCE_PUSH: "false"
        GITLAB_HOSTNAME: "git.drupal.org"
        GITLAB_USERNAME: "foo"
        GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
        GITLAB_PROJECT_ID: "237828"
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

